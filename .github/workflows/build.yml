name: Build BAGIO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Windows is built and published locally by the Control Board.
# This CI job only handles the macOS DMG — it runs after the Control Board
# creates the release (which creates the tag, which triggers this workflow).

jobs:
  build-macos:
    runs-on: macos-13
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build macOS DMG (unsigned, x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: npm run build-mac

      - name: Show dist contents
        if: always()
        run: |
          echo "=== dist/ contents ==="
          find dist/ -type f 2>/dev/null || echo "(dist/ is empty or missing)"

      - name: Upload DMG to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Looking for DMG for v${VERSION}..."
          DMG=$(find dist/ -name "*.dmg" 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "ERROR: No .dmg found in dist/"
            exit 1
          fi
          echo "Found: $DMG"
          DMG_NAME=$(basename "$DMG")

          RELEASE_JSON=$(curl -sf \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${VERSION}")

          if [ -z "$RELEASE_JSON" ]; then
            echo "ERROR: Could not find release v${VERSION} on GitHub"
            exit 1
          fi

          UPLOAD_URL=$(echo "$RELEASE_JSON" | python3 -c \
            "import sys,json; u=json.load(sys.stdin)['upload_url']; print(u.split('{')[0])")

          echo "Uploading $DMG_NAME..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$DMG" \
            "${UPLOAD_URL}?name=${DMG_NAME}")

          echo "Upload HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "201" ] || [ "$HTTP_STATUS" = "200" ]; then
            echo "✓ DMG uploaded successfully"
          else
            echo "ERROR: Upload failed with HTTP $HTTP_STATUS"
            exit 1
          fi
