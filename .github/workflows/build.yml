name: Build BAGIO

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-13
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build macOS DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: npm run build-mac

      - name: List dist/
        if: always()
        run: find dist/ -type f 2>/dev/null || echo "(dist empty or missing)"

      - name: Upload DMG to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          DMG=$(find dist/ -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "ERROR: no .dmg found — build step failed"
            exit 1
          fi
          echo "Uploading $(basename $DMG) → v${VERSION}"

          # Wait up to 60s for Windows job to finish creating the release
          for i in $(seq 1 12); do
            RELEASE=$(curl -sf \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${VERSION}" 2>/dev/null)
            [ -n "$RELEASE" ] && break
            echo "  waiting for release to appear ($((i*5))s)..."
            sleep 5
          done

          if [ -z "$RELEASE" ]; then
            echo "ERROR: release v${VERSION} not found on GitHub after 60s"
            exit 1
          fi

          UPLOAD_URL=$(echo "$RELEASE" | python3 -c \
            "import sys,json; print(json.load(sys.stdin)['upload_url'].split('{')[0])")

          STATUS=$(curl -s -o /tmp/up.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$DMG" \
            "${UPLOAD_URL}?name=$(basename $DMG)")

          echo "HTTP $STATUS"
          cat /tmp/up.json
          if [ "$STATUS" = "201" ]; then
            echo "✓ macOS DMG uploaded"
          elif [ "$STATUS" = "422" ]; then
            echo "Asset already exists on release — skipping (not an error)"
          else
            exit 1
          fi
