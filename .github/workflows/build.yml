name: Build BAGIO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build and publish the Windows app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish

  build-macos:
    runs-on: macos-13
    timeout-minutes: 60
    needs: build-windows
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build macOS DMG (unsigned, x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        run: npm run build-mac

      - name: Upload DMG to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Version: $VERSION"
          echo "Contents of dist/:"
          ls -la dist/ 2>/dev/null || echo "(dist/ is empty or missing)"
          DMG=$(ls dist/*.dmg 2>/dev/null | head -1)
          if [ -n "$DMG" ]; then
            echo "Uploading: $DMG"
            gh release upload "v${VERSION}" "$DMG" --clobber --repo "${{ github.repository }}"
            echo "Upload complete"
          else
            echo "ERROR: No .dmg found in dist/"
            exit 1
          fi
